<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f4c5c">
  <meta name="description" content="Calcul des points — grille d’évaluation pour la promotion au grade de Professeur (CUN), versions 2026 et 2028. Arabe, français, anglais.">
  <title>Grille Professeur</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar no-print">
    <a href="#" id="brand" class="brand">
      <img src="icons/icon.svg" alt="" width="36" height="36">
      <span class="brand-text"><strong id="brand-name">Grille Professeur</strong><small id="brand-tag"></small></span>
    </a>
    <div class="langs" role="group" aria-label="Language">
      <button class="lang-btn" data-lang="ar" lang="ar">عربية</button>
      <button class="lang-btn" data-lang="fr" lang="fr">FR</button>
      <button class="lang-btn" data-lang="en" lang="en">EN</button>
    </div>
  </header>
  <nav id="stepper" class="stepper no-print" aria-label="Steps"></nav>
  <main id="app" class="container"></main>
  <footer class="footer"><p id="footer-note"></p></footer>
  <div id="scorebar" class="scorebar no-print" hidden></div>

  <script src="js/grids.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/calc.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
